<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist ICON BAY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#102e63;--blue:#1f5aa6;--bg:#f3f5f8;--line:#dbe1ea;--green:#197344}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 Arial,sans-serif;color:#172033}header{background:var(--navy);color:white;padding:20px max(16px,calc((100% - 1180px)/2))}h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#dbe7ff}main{max-width:1180px;margin:18px auto;padding:0 14px}.panel,.stat,.item{background:white;border:1px solid var(--line);border-radius:12px}.login{max-width:430px;margin:8vh auto;padding:22px}.login input{width:100%;margin:6px 0 12px}input,select,textarea,button{font:inherit;border:1px solid #cbd3df;border-radius:8px;padding:9px;background:white;color:#172033}button{cursor:pointer;background:var(--blue);color:white;border-color:var(--blue);font-weight:600}.secondary{background:white;color:var(--navy)}.hidden{display:none!important}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{padding:13px}.stat b{display:block;font-size:23px;color:var(--navy)}.stat span{font-size:12px;color:#5e6878}.progress{height:9px;background:#e5eaf1;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#20865a}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px;margin-bottom:14px}.controls input{flex:1;min-width:180px}.list{display:grid;gap:12px}.item{padding:13px;display:grid;grid-template-columns:1fr 2fr;gap:15px}.meta{font-size:12px;color:#566276}.pill{background:#edf2fa;border-radius:99px;padding:3px 8px;color:#24446f;font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields label{font-size:12px;color:#596579}.fields input,.fields select,.fields textarea{width:100%;margin-top:3px}.fields textarea{min-height:55px}.status{font-size:13px;margin:8px 0}.error{color:#a33}.ok{color:#197344}.muted{color:#667085;font-size:13px}.evidence img{max-width:130px;max-height:95px;object-fit:cover}.empty{padding:24px;text-align:center;background:white;border-radius:12px;color:#667085}@media(max-width:680px){.summary{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Checklist de correcciones – ICON BAY</h1><p>Cristalería Martos Arquitectos · Seguimiento de correcciones</p><button id="logout" class="secondary hidden">Cerrar sesión</button></header>
<main><section id="login" class="panel login"><h2>Acceso al checklist</h2><p class="muted">Ingresa con tu cuenta autorizada.</p><label>Correo electrónico<input id="email" type="email" autocomplete="username"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">Iniciar sesión</button><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden"><div id="role" class="status"></div><div class="summary"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="done">0</b><span>Corregidos</span></div><div class="stat"><b id="pending">0</b><span>Pendientes</span></div><div class="stat"><b id="pct">0%</b><span>Avance<div class="progress"><div id="bar" class="bar"></div></div></span></div></div>
<div class="panel controls"><input id="search" placeholder="Buscar apartamento o trabajo"><select id="floor"><option value="">Todos los niveles</option></select><select id="statusFilter"><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Corregido</option><option>No aplica</option></select><select id="areaFilter"><option value="">Todas las áreas</option></select></div><div id="list" class="list"></div></section></main>
<script>
const URL='https://wdakfzzgvpwgnigqjsf.supabase.co',KEY='sb_publishable_tfARWndD8hKcY4FLEjQPcg_k2RPPImv';
let db=null;const supervisors=['rherrera@proyeco.es','fortiz@proyeco.es'];let rows=[],user=null,editor=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('loginBtn').onclick=async()=>{const msg=$('loginMsg'),btn=$('loginBtn');msg.className='status';msg.textContent='Verificando conexión e inicio de sesión…';btn.disabled=true;try{if(!window.supabase||!window.supabase.createClient){throw new Error('No se pudo cargar Supabase desde Internet. Comprueba la conexión o prueba otro navegador.')}if(!db)db=window.supabase.createClient(URL,KEY);const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw new Error('Escribe tu correo y contraseña.');const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;user=data.user;msg.textContent='Acceso correcto. Cargando checklist…';await start()}catch(err){msg.className='status error';msg.textContent='No se pudo iniciar sesión: '+(err.message||'Error desconocido');console.error('Login ICON BAY:',err)}finally{btn.disabled=false}};
$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
$('logout').onclick=async()=>{await db.auth.signOut();user=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden')};
async function start(){if(!user)return;editor=supervisors.includes((user.email||'').toLowerCase());$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('role').textContent=editor?'Supervisor: puedes editar y subir fotografías.':'Solo lectura: puedes consultar los avances.';$('role').className='status '+(editor?'ok':'');await load()}
async function load(){const {data,error}=await db.from('checklist_items').select('*').order('item_number');if(error){$('list').textContent='Error: '+error.message;return}rows=data||[];const floors=[...new Set(rows.map(x=>(x.apartment||'').split('-')[0]).filter(Boolean))].sort(),areas=[...new Set(rows.map(x=>x.area).filter(Boolean))].sort();$('floor').innerHTML='<option value="">Todos los niveles</option>'+floors.map(x=>'<option>'+esc(x)+'</option>').join('');$('areaFilter').innerHTML='<option value="">Todas las áreas</option>'+areas.map(x=>'<option>'+esc(x)+'</option>').join('');render()}
function render(){let q=$('search').value.toLowerCase(),f=$('floor').value,s=$('statusFilter').value,a=$('areaFilter').value;let list=rows.filter(x=>(!q||((x.apartment||'')+' '+(x.area||'')+' '+(x.description||'')).toLowerCase().includes(q))&&(!f||(x.apartment||'').startsWith(f))&&(!s||x.status===s)&&(!a||x.area===a));let corrected=rows.filter(x=>x.status==='Corregido').length,pending=rows.filter(x=>x.status==='Pendiente').length,complete=rows.filter(x=>['Corregido','No aplica'].includes(x.status)).length,p=rows.length?Math.round(complete/rows.length*100):0;$('total').textContent=rows.length;$('done').textContent=corrected;$('pending').textContent=pending;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('list').innerHTML=list.length?list.map(x=>'<article class="item" data-id="'+x.id+'"><div><div class="meta">Referencia fotográfica: '+esc(x.photo_ref||'No disponible')+'</div><p class="muted">La imagen de referencia se incorporará en la siguiente actualización.</p><div class="evidence" id="e'+x.id+'"></div></div><div><div class="meta"><span class="pill">'+esc(x.apartment)+'</span> · '+esc(x.area)+' · Registro #'+x.item_number+'</div><h3>'+esc(x.apartment)+' · '+esc(x.area)+'</h3><p>'+esc(x.description)+'</p><div class="fields"><label>Estado<select data-field="status" '+(!editor?'disabled':'')+'>'+['Pendiente','En proceso','Corregido','No aplica'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Responsable<input data-field="assigned_to" value="'+esc(x.assigned_to||'')+'" '+(!editor?'disabled':'')+'></label><label>Fecha de corrección<input type="date" data-field="corrected_at" value="'+esc(x.corrected_at||'')+'" '+(!editor?'disabled':'')+'></label><label>Observaciones<textarea data-field="notes" '+(!editor?'disabled':'')+'>'+esc(x.notes||'')+'</textarea></label></div>'+(editor?'<p><label>Foto de evidencia <input type="file" data-field="evidence" accept="image/*" capture="environment"></label></p>':'')+'</div></article>').join(''):'<div class="empty">No hay resultados.</div>';list.forEach(async x=>{if(x.evidence_path){const {data}=await db.storage.from('icon-bay-evidence').createSignedUrl(x.evidence_path,3600);if(data)$('e'+x.id).innerHTML='<a href="'+data.signedUrl+'" target="_blank"><img src="'+data.signedUrl+'"></a>'}})}
$('list').addEventListener('change',async e=>{if(!editor)return;const card=e.target.closest('[data-id]'),field=e.target.dataset.field;if(!card||!field)return;const row=rows.find(x=>x.id===Number(card.dataset.id));if(field==='evidence'){const file=e.target.files[0];if(!file)return;const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');const path=row.item_number+'/'+Date.now()+'.'+ext;const {error:up}=await db.storage.from('icon-bay-evidence').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});if(up){alert(up.message);return}await save(row,'evidence_path',path);return}await save(row,field,e.target.value||null)});
async function save(row,field,value){const {data,error}=await db.from('checklist_items').update({[field]:value}).eq('id',row.id).select().single();if(error){alert('No se pudo guardar: '+error.message);return}Object.assign(row,data);render()}
['search','floor','statusFilter','areaFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
db.auth.onAuthStateChange(async(_e,session)=>{if(session?.user){user=session.user;await start()}});
(async()=>{const {data:{session}}=await db.auth.getSession();if(session?.user){user=session.user;await start()}})();
</script></body></html>
